<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge</title>
<meta name="description" content="A calm, shame-free day planner built for ADHD brains: one thing at a time, visual timers, routines and gentle help when you're stuck.">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111017" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nudge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700&display=swap">
<style>
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#EDEAE3;--line:rgba(30,27,46,.09);
  --ink:#1E1B2E;--ink-2:rgba(30,27,46,.74);--ink-3:rgba(30,27,46,.5);
  --accent:#6C5CE7;--accent-2:#8F82F2;--accent-text:#5443D6;--accent-ink:#fff;
  --accent-soft:rgba(108,92,231,.1);--accent-line:rgba(108,92,231,.2);--accent-glow:rgba(108,92,231,.5);
  --low:#1E9E66;--low-soft:#E0F4EA;--med:#3170E8;--med-soft:#E4ECFD;--high:#E8670F;--high-soft:#FDEBDD;
  --star:#F2A20C;--good:#22A06B;--warn:#B45309;--warn-soft:#FDF1DC;--danger:#D23B4B;
  --shadow:0 1px 2px rgba(48,36,120,.05),0 8px 24px rgba(76,60,170,.07);
  --shadow-lg:0 16px 48px rgba(52,40,140,.18);
  --scrim:rgba(20,16,36,.4);
  --fs-s:13px;--fs-m:16px;--fs-l:24px;--fs-xl:40px;
  --tabbar:68px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111017;--surface:#1C1A25;--surface-2:#282634;--line:rgba(255,255,255,.08);
  --ink:#F3F1FA;--ink-2:rgba(243,241,250,.76);--ink-3:rgba(243,241,250,.5);
  --accent:#7565F5;--accent-2:#A79BFF;--accent-text:#B1A6FF;
  --accent-soft:rgba(140,125,255,.16);--accent-line:rgba(140,125,255,.3);--accent-glow:rgba(117,101,245,.45);
  --low:#45D695;--low-soft:rgba(69,214,149,.14);--med:#76A6FF;--med-soft:rgba(118,166,255,.15);--high:#FF9C57;--high-soft:rgba(255,156,87,.15);
  --star:#FFC44D;--good:#3CCB85;--warn:#F6B74E;--warn-soft:rgba(246,183,78,.13);--danger:#FF6B7B;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111017;--surface:#1C1A25;--surface-2:#282634;--line:rgba(255,255,255,.08);
  --ink:#F3F1FA;--ink-2:rgba(243,241,250,.76);--ink-3:rgba(243,241,250,.5);
  --accent:#7565F5;--accent-2:#A79BFF;--accent-text:#B1A6FF;
  --accent-soft:rgba(140,125,255,.16);--accent-line:rgba(140,125,255,.3);--accent-glow:rgba(117,101,245,.45);
  --low:#45D695;--low-soft:rgba(69,214,149,.14);--med:#76A6FF;--med-soft:rgba(118,166,255,.15);--high:#FF9C57;--high-soft:rgba(255,156,87,.15);
  --star:#FFC44D;--good:#3CCB85;--warn:#F6B74E;--warn-soft:rgba(246,183,78,.13);--danger:#FF6B7B;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs-m);font-weight:500;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
b,strong,h1,h2,h3{font-weight:700}
svg{display:block}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:var(--fs-s);color:var(--ink-3)}
.hint{font-size:var(--fs-s);color:var(--ink-3);margin-top:8px}
.center{text-align:center}
.eyebrow{font-size:var(--fs-s);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow.accent{color:var(--accent-text)}
.h1{font-size:var(--fs-l);line-height:1.2;letter-spacing:-.01em}
.big{font-size:var(--fs-xl);font-weight:700;line-height:1;letter-spacing:-.02em}
.row{display:flex;gap:8px;margin-top:16px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.lead{margin-top:4px;color:var(--ink-2);font-size:var(--fs-m)}

#app{position:fixed;inset:0;max-width:540px;margin:0 auto}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;padding:calc(var(--safe-t) + 16px) 16px calc(var(--tabbar) + var(--safe-b) + 32px)}
.view::-webkit-scrollbar{display:none}
#app.has-pill .view{padding-bottom:calc(var(--tabbar) + var(--safe-b) + 96px)}
.view.enter > *{animation:rise .38s cubic-bezier(.2,.8,.3,1) both}
.view.enter > *:nth-child(2){animation-delay:.03s}.view.enter > *:nth-child(3){animation-delay:.06s}.view.enter > *:nth-child(4){animation-delay:.09s}.view.enter > *:nth-child(n+5){animation-delay:.12s}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0}
.top-text{min-width:0}
.top .eyebrow{margin-bottom:4px}
.sos{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:var(--fs-s);transition:transform .15s}
.sos svg{width:18px;height:18px}
.sos:active{transform:scale(.96)}

/* cards & sections */
.card{display:block;width:100%;background:var(--surface);border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-top:16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.section{margin-top:24px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin-top:16px}
.sec-head h3,.sec-toggle h3{font-size:var(--fs-m)}
.sec-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-s);margin-left:4px;vertical-align:1px}
.count.good{background:var(--low-soft);color:var(--low)}
.chev svg{width:20px;height:20px;color:var(--ink-3);transition:transform .25s}
.chev.open svg{transform:rotate(180deg)}
.foot{text-align:center;font-size:var(--fs-s);color:var(--ink-3);margin:32px 0 8px;line-height:1.6}
.divider{height:1px;background:var(--line);margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;white-space:nowrap;transition:transform .15s ease,background .2s,opacity .2s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -10px var(--accent-glow)}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.ghost{color:var(--ink-2)}
.btn.xl{width:100%;min-height:56px;border-radius:18px}
.btn.sm{min-height:44px;padding:0 14px;border-radius:14px;font-size:var(--fs-s)}
.btn[disabled]{opacity:.45;pointer-events:none}
.danger{color:var(--danger)!important}
.armed{background:var(--danger)!important;color:#fff!important}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent-text);font-weight:700;font-size:var(--fs-s)}
.link svg{width:16px;height:16px}
.link.block{display:flex;margin:4px auto 0}
.icon-btn{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.accent{background:var(--accent);color:#fff;box-shadow:0 10px 22px -10px var(--accent-glow)}
.icon-btn.plain{background:none;box-shadow:none;color:var(--ink-3)}
.icon-btn.xs{width:40px;height:40px;border-radius:12px}
.icon-btn.xs svg{width:18px;height:18px}
.icon-btn[disabled]{opacity:.3;pointer-events:none}
.toggle{flex:none;position:relative;width:52px;height:32px;border-radius:999px;background:var(--surface-2);transition:background .2s}
.toggle::before{content:"";position:absolute;inset:-8px}
.toggle span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.toggle.on{background:var(--good)}
.toggle.on span{transform:translateX(20px)}

/* chips & segmented controls */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.center{justify-content:center;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-s);font-weight:700;white-space:nowrap}
.chip.e-low{background:var(--low-soft);color:var(--low)}.chip.e-med{background:var(--med-soft);color:var(--med)}.chip.e-high{background:var(--high-soft);color:var(--high)}
.chip.lg{height:auto;min-height:36px;padding:4px 4px 4px 12px;color:var(--ink);white-space:normal}
.chip.lg button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--ink-3)}
.chip.lg button svg{width:14px;height:14px}
.chip-btn{flex:none;height:44px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;white-space:nowrap;transition:all .2s}
.chip-btn.sm{font-size:var(--fs-s);padding:0 14px}
.chip-btn.on{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px var(--accent-glow)}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:16px}
.seg button{flex:1;min-height:40px;padding:0 6px;border-radius:12px;font-weight:700;font-size:var(--fs-s);color:var(--ink-2);transition:background .2s,color .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:4px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(30,27,46,.1)}
.seg.sm button{min-height:36px}
.seg.tall button{min-height:60px;flex-direction:column;gap:2px}
.seg .e-emo{font-size:22px;line-height:1}
.opt{margin-top:16px}
.label{display:block;font-size:var(--fs-s);font-weight:700;color:var(--ink-2);margin-bottom:8px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt-row .sub{margin-top:2px}

/* inputs */
.input{width:100%;min-height:48px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.input:focus{border-color:var(--accent)}
.input.area{resize:none;line-height:1.5;display:block;margin-top:12px}
input[type="time"].input{min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field>span{font-size:var(--fs-s);font-weight:700;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-add{display:flex;gap:8px;align-items:center;margin-top:12px}
.quick-add .input{flex:1}
input[type="range"]{accent-color:var(--accent)}

/* tasks */
.list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.task{display:flex;align-items:center;gap:4px;width:100%;background:var(--surface);border-radius:20px;padding:6px 12px 6px 6px;box-shadow:var(--shadow);text-align:left;transition:transform .15s}
.task.slim{padding:6px 8px 6px 6px;gap:8px}
.task-main{flex:1;display:flex;align-items:center;gap:12px;min-height:52px;min-width:0;text-align:left}
.task-main:active,.row-btn:active,.pickrow:active,.wrapcta:active,.tile:active,button.task:active{transform:scale(.98)}
.task-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task-text .title{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:var(--fs-s);color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.meta .sep{opacity:.5}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:-2px}
.dot.e-low{background:var(--low)}.dot.e-med{background:var(--med)}.dot.e-high{background:var(--high)}
.emo-tile{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--surface-2)}
.emo-tile.sm{width:40px;height:40px;font-size:20px;border-radius:12px}
.emo-tile.lg{width:56px;height:56px;font-size:28px;border-radius:18px}
.emo-tile.e-low{background:var(--low-soft)}.emo-tile.e-med{background:var(--med-soft)}.emo-tile.e-high{background:var(--high-soft)}
.star-ic svg{width:18px;height:18px;fill:var(--star);stroke:var(--star)}
.check{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.check span{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink-3);display:grid;place-items:center;transition:background .2s,border-color .2s}
.check span::after{content:"";width:11px;height:6px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) scale(0);margin-top:-3px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.check.sm span{width:22px;height:22px}
.check.on span,.task.done .check span,.task.checking .check span{background:var(--good);border-color:var(--good)}
.check.on span::after,.task.done .check span::after,.task.checking .check span::after{transform:rotate(-45deg) scale(1)}
.task.checking .check span{animation:pop .35s}
.task.checking .title{text-decoration:line-through;color:var(--ink-3)}
.task.checking{animation:away .3s .32s ease forwards}
.task.done .title{text-decoration:line-through;color:var(--ink-3)}
.task.done{box-shadow:none;background:transparent}
.star-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink-3)}
.star-btn svg{width:22px;height:22px}
.star-btn.on{color:var(--star)}
.star-btn.on svg{fill:var(--star)}
.empty-line{padding:12px 4px}

/* now card */
.now{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft),transparent 60%),var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--accent-line)}
.now-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:28px}
.now-head .chip{border:0}
.now-title{display:flex;align-items:center;gap:16px;width:100%;text-align:left}
.now-title h2{font-size:var(--fs-l);line-height:1.2;letter-spacing:-.01em;word-break:break-word}
.now-title .meta{margin-top:6px}
.nextstep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:16px;padding:12px 16px;border-radius:16px;background:var(--bg);min-height:60px;font-weight:700;transition:transform .15s}
.nextstep:active{transform:scale(.98)}
.nextstep .box{flex:none;width:24px;height:24px;border-radius:8px;border:2.5px solid var(--accent)}
.nextstep small{display:block;font-size:var(--fs-s);color:var(--ink-3)}
.nextstep.ghosty{background:transparent;border:1.5px dashed var(--accent-line);color:var(--accent-text)}
.nextstep .spark svg{width:24px;height:24px}
.now-actions{display:flex;gap:8px;margin-top:16px}
.now-actions .btn.primary{flex:1;min-height:56px}
.now-actions .btn.soft{min-height:56px}
.now-links{display:flex;justify-content:space-between;margin-top:4px;margin-bottom:-8px}
.now.checking{animation:nowDone .55s ease forwards}
.now.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.now.empty .row{width:100%}
.now.empty h2{font-size:var(--fs-l);margin-top:4px}
.energy-check b{display:block}
.energy-check .seg{margin-top:12px}

/* time card */
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tc-top .sub{margin-top:6px;font-weight:700}
.tc-clock{font-size:var(--fs-s);font-weight:700;color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:999px;white-space:nowrap}
.daybar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);margin:20px 0 8px}
.db-past{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ink);opacity:.18}
.db-plan{position:absolute;top:0;bottom:0;border-radius:0 999px 999px 0;background:var(--accent)}
.db-plan.over{background:var(--warn)}
.db-now{position:absolute;top:-5px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.db-labels{display:flex;justify-content:space-between;font-size:var(--fs-s);color:var(--ink-3);font-weight:700}
.tc-msg{margin-top:12px;font-size:var(--fs-s);font-weight:700;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tc-msg::before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--accent)}
.tc-msg.warn{color:var(--warn)}
.tc-msg.warn::before{background:var(--warn)}
.tc-msg.none::before{display:none}
.add-cd{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 16px;border-radius:18px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:var(--fs-s);min-height:52px;text-align:left}
.add-cd svg{width:18px;height:18px;flex:none;color:var(--ink-3)}
.add-cd b{color:var(--accent-text)}
.cd-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cd-top .big{margin-top:8px}
.cd-top .sub{margin-top:6px;font-weight:700}
.cd-bar{height:8px;border-radius:999px;background:var(--surface-2);margin-top:16px;overflow:hidden}
.cd-bar span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s}
.cd-fit{margin-top:12px;font-size:var(--fs-s);font-weight:700;color:var(--ink-2)}
.cd .chips{margin-top:8px}
.cd.go{background:var(--accent);color:#fff;box-shadow:0 18px 40px -16px var(--accent-glow)}
.cd.go .sub,.cd.go .eyebrow{color:rgba(255,255,255,.82)}
.cd.go .cd-bar{background:rgba(255,255,255,.25)}
.cd.go .cd-bar span{background:#fff}
.cd.go .icon-btn{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.cd.go .btn.primary{background:#fff;color:var(--accent);margin-top:16px}

/* misc cards */
.banner{background:linear-gradient(135deg,var(--warn-soft),transparent 80%),var(--surface)}
.banner .sub{margin-top:4px;color:var(--ink-2)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:16px 8px 12px 16px;background:linear-gradient(135deg,var(--accent-soft),transparent 75%),var(--surface)}
.tip .emo{font-size:24px;line-height:1.2}
.tip-text{flex:1}
.tip-text .sub{margin-top:2px;color:var(--ink-2)}
.tip .link{margin-bottom:-8px}
.wrapcta{display:flex;align-items:center;gap:16px;text-align:left;transition:transform .15s}
.wrapcta .emo{font-size:30px}
.wrapcta svg{width:20px;height:20px;color:var(--ink-3)}
.wc-text{flex:1;display:flex;flex-direction:column;gap:2px}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);margin-top:12px;min-height:64px;transition:transform .15s}
.row-btn>span:not(.toggle):not(.t-emo){flex:1;display:flex;flex-direction:column;gap:2px}
.row-btn>svg{width:22px;height:22px;flex:none;color:var(--ink-3)}
.row-btn.on>svg:first-child{fill:var(--star);stroke:var(--star);color:var(--star)}
.t-emo{font-size:28px;line-height:1.1;flex:none}
.pickrow{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;transition:transform .15s}
.pickrow>svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.pr-text{flex:1;min-width:0;display:flex;flex-direction:column}
.pr-text b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:left;min-height:112px;transition:transform .15s,box-shadow .2s,background .2s}
.tile.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tile .t-emo{margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}

/* focus */
.dial-wrap{position:relative;display:grid;place-items:center;padding:12px 0}
.dial-wrap::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--accent);filter:blur(56px);opacity:.2}
.dial{--p:1;--size:min(64vw,248px);position:relative;width:var(--size);height:var(--size);border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p) * 360deg),var(--surface-2) 0);box-shadow:var(--shadow)}
.dial::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -.75deg,var(--bg) 0 1.5deg,transparent 1.5deg 30deg)}
.dial-face{position:absolute;inset:20%;border-radius:50%;background:var(--surface);display:grid;place-content:center;text-align:center;box-shadow:0 4px 18px rgba(30,27,46,.1)}
.dial-time{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em;line-height:1}
.dial.big{--size:min(70vw,300px,40vh)}
.dial.big .dial-time{font-size:min(14vw,56px)}
.dial.paused{filter:saturate(.35);opacity:.85}
.is-break .dial{background:conic-gradient(var(--low) calc(var(--p) * 360deg),var(--surface-2) 0)}
.vol{display:flex;align-items:center;gap:12px;color:var(--ink-3)}
.vol svg{width:20px;height:20px;flex:none}
.vol input{flex:1}
.sticky-cta{position:sticky;bottom:calc(var(--tabbar) + var(--safe-b) + 8px);margin-top:16px;padding-top:24px;background:linear-gradient(transparent,var(--bg) 40%);z-index:2}
#app.has-pill .sticky-cta{bottom:calc(var(--tabbar) + var(--safe-b) + 72px)}
.focus-run{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.focus-run .nextstep{background:var(--surface);box-shadow:var(--shadow)}
.fr-title{font-size:var(--fs-l);line-height:1.2;margin-top:4px;padding:0 8px}
.buddy-row{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:8px;min-height:56px}
.bubble{position:relative;background:var(--surface);padding:10px 14px;border-radius:16px 16px 16px 4px;box-shadow:var(--shadow);font-weight:700;font-size:var(--fs-s);max-width:230px;margin-bottom:24px;animation:pop .4s}
.run-ctrl{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:12px}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transition:transform .15s;font-size:var(--fs-m)}
.round:active{transform:scale(.94)}
.round svg{width:26px;height:26px}
.round.big{width:84px;height:84px}
.round.big svg{width:32px;height:32px}
.round.primary{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 30px -10px var(--accent-glow)}
.round.soft{background:var(--accent-soft);color:var(--accent-text)}
.pill-float{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + var(--safe-b) + 12px);z-index:15;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:var(--fs-s);box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:rise .3s}
.pill-float[hidden]{display:none}
.pdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
.pdot.paused{background:var(--warn);animation:none}
.pill-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;opacity:.75}

/* buddy */
.buddy{flex:none;overflow:visible;animation:bob 3.4s ease-in-out infinite}
.buddy .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

/* routines */
.routine{padding:16px}
.r-main{display:flex;align-items:center;gap:16px;width:100%;text-align:left}
.r-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.r-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pill{font-weight:700;font-size:var(--fs-s);padding:6px 12px;border-radius:999px}
.pill.good{background:var(--low-soft);color:var(--low)}
.gap16{gap:0}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);max-width:540px;margin:0 auto;max-height:calc(var(--vvh,100dvh) - var(--safe-t) - 16px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;background:var(--bg);border-radius:28px 28px 0 0;padding:0 16px calc(var(--safe-b) + 24px);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(17,14,30,.2)}
.sheet::-webkit-scrollbar{display:none}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{position:sticky;top:0;z-index:3;height:28px;margin:0 -16px;display:grid;place-items:center;background:var(--bg)}
.grab::after{content:"";width:40px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.35}
.sh-head{margin-bottom:12px}
.sh-head h2{font-size:var(--fs-l);line-height:1.2}
.sh-head .sub{margin-top:6px;color:var(--ink-2)}
.sh-head.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.sh-actions{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.big-emoji{font-size:48px;line-height:1.1}
.ts-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.emoji-in{flex:none;width:56px;height:56px;border-radius:18px;border:0;background:var(--surface-2);text-align:center;font-size:28px;outline:none;padding:0}
.emoji-in.sm{width:44px;height:44px;font-size:22px;border-radius:14px}
.title-in{flex:1;min-width:0;border:0;background:transparent;font-size:var(--fs-l);font-weight:700;line-height:1.25;padding:12px 0;outline:none;resize:none;overflow:hidden;min-height:56px}
#dump{min-height:156px;margin-top:0}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.step{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:16px;padding:2px 2px 2px 0;box-shadow:var(--shadow)}
.step-in{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:12px 4px;outline:none}
.step.done .step-in{text-decoration:line-through;color:var(--ink-3)}
.step.add{box-shadow:none;background:transparent;border:1.5px dashed var(--line);padding-left:0}
.plus{flex:none;width:44px;display:grid;place-items:center;color:var(--ink-3)}
.plus svg{width:20px;height:20px}
.ifthen{display:flex;flex-direction:column;gap:8px;padding:12px;margin-top:4px}
.ifthen label{display:flex;align-items:center;gap:8px}
.ifthen label span{flex:none;width:52px;font-weight:700;font-size:var(--fs-s);color:var(--accent-text)}
.ifthen .input{min-height:44px;padding:10px 12px}
.rstep{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:4px}
.rs-line{display:flex;align-items:center;gap:8px}
.mins-in{width:64px;min-height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:16px;outline:none;padding:0 4px}
.rs-tools{margin-left:auto;display:flex;gap:4px}
.reality{margin-top:16px;padding:12px 16px;border-radius:16px;background:var(--low-soft);font-size:var(--fs-s);font-weight:700}
.reality.warn{background:var(--warn-soft)}
.wrap-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.wrap-row:last-child{border-bottom:0}
.wrap-row .title{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:700;line-height:1.3}
.wrap-row .seg{flex:none;width:160px}
.wrap-row .seg button{padding:0 4px}
.moods{display:flex;justify-content:space-between;margin-top:12px}
.moods button{width:52px;height:52px;border-radius:16px;font-size:28px;display:grid;place-items:center;filter:grayscale(.7);opacity:.6;transition:all .2s}
.moods button.on{filter:none;opacity:1;background:var(--accent-soft);transform:scale(1.1)}
.tada{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.tada li{display:flex;gap:10px;align-items:baseline}
.tada .w-t{flex:1;min-width:0}
.steps-ol{margin:16px 0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps-ol li{counter-increment:s;display:flex;align-items:center;gap:12px}
.steps-ol li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none}
.steps-ol svg{display:inline-block;width:18px;height:18px;vertical-align:-3px;color:var(--accent-text)}
.app-icon{width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow)}
.app-icon.lg{width:104px;height:104px;border-radius:24px}
.shrunk{background:var(--accent);color:#fff;box-shadow:0 18px 40px -16px var(--accent-glow)}
.shrunk-step{font-size:var(--fs-l);line-height:1.25}
.surprise{min-height:140px;display:grid;place-items:center;font-size:var(--fs-l);animation:pop .4s}

/* me */
.me-id{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{flex:none;width:52px;height:52px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:var(--fs-l);font-weight:700;overflow:hidden}
.avatar.soft{background:var(--accent-soft)}
.bars{display:flex;justify-content:space-between;align-items:flex-end;height:132px;margin-top:16px;gap:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bf{width:100%;max-width:28px;border-radius:8px;background:var(--accent-soft);transition:height .5s}
.bar.today .bf{background:var(--accent)}
.bv{font-size:var(--fs-s);font-weight:700;color:var(--ink-2);min-height:18px}
.bl{font-size:var(--fs-s);color:var(--ink-3);font-weight:700}
.bar.today .bl{color:var(--accent-text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:var(--fs-l);line-height:1.1}
.insight{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(135deg,var(--accent-soft),transparent 80%),var(--surface)}
.insight b{display:block;margin-top:2px}
.menu .seg{margin-top:16px}
.menu .chips{margin-top:12px}
.menu .btn.xl{margin-top:16px}
.tk{padding:0;margin-top:8px;overflow:hidden}
.tk summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;min-height:60px}
.tk summary::-webkit-details-marker{display:none}
.tk summary b{flex:1}
.tk[open] .chev svg{transform:rotate(180deg)}
.tk p{padding:0 16px;color:var(--ink-2)}
.tk a{display:inline-flex;min-height:44px;align-items:center;padding:4px 16px 12px;font-size:var(--fs-s);font-weight:700;color:var(--accent-text);text-decoration:none}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--safe-t) + 12px) 24px calc(var(--safe-b) + 24px)}
.overlay[hidden]{display:none}
.overlay.in{animation:fadeIn .25s}
.overlay>div{max-width:480px;margin:0 auto;min-height:calc(100dvh - var(--safe-t) - var(--safe-b) - 36px)}
.ov-top{display:flex;align-items:center;gap:12px;min-height:44px}
.celebrate{display:flex;flex-direction:column;justify-content:center;gap:16px}
.cel-art{display:grid;place-items:center;animation:jump 1.1s ease}
.celebrate .h1{font-size:var(--fs-xl);line-height:1.1}
.idea{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:0}
.idea b{font-size:var(--fs-m)}
.night-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0}
.night-stats div{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:20px;padding:16px 8px;box-shadow:var(--shadow)}
.night-stats b{font-size:var(--fs-l)}
.run{display:flex;flex-direction:column}
.segs{flex:1;display:flex;gap:4px}
.segs span{flex:1;height:6px;border-radius:3px;background:var(--surface-2);transition:background .3s}
.segs .done{background:var(--rc,var(--accent))}
.segs .cur{background:var(--rc,var(--accent));opacity:.4}
.run-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px 0}
.run-emoji{font-size:80px;line-height:1;width:152px;height:152px;display:grid;place-items:center;border-radius:48px;background:color-mix(in srgb,var(--rc,var(--accent)) 16%,transparent);animation:pop .45s}
.run-title{font-size:var(--fs-xl);line-height:1.1;letter-spacing:-.02em;max-width:16ch}
.mini-dial{--p:1;position:relative;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p) * 360deg),var(--surface-2) 0);display:grid;place-items:center}
.mini-dial::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.mini-dial span{position:relative;z-index:1;font-weight:700}
.run .btn.primary{background:var(--rc,var(--accent))}
.decide{display:flex;flex-direction:column}
.slot{margin:40px auto 32px;width:100%;max-width:340px;min-height:200px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.slot-emo{font-size:56px;line-height:1}
.slot-t{font-size:var(--fs-l);line-height:1.2}
.slot.flip{animation:flip .12s}
.slot.landed{animation:pop .5s;box-shadow:0 0 0 4px var(--accent-line),var(--shadow-lg)}
.breathe{display:flex;flex-direction:column}
.b-stage{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:32px auto 24px;display:grid;place-items:center}
.b-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--accent-line)}
.b-circle{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-2),var(--accent));transform:scale(.55);box-shadow:0 24px 60px -14px var(--accent-glow)}
.b-label{position:relative;z-index:1;color:#fff;text-align:center;display:flex;flex-direction:column;gap:4px}
.b-label b{font-size:var(--fs-l)}
.b-label span{font-size:var(--fs-xl);font-weight:700;line-height:1}
.ob{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:8px 0}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.ob-dots span{width:8px;height:8px;border-radius:4px;background:var(--surface-2);transition:all .3s}
.ob-dots .on{width:24px;background:var(--accent)}
.ob-art{display:grid;place-items:center;padding:8px 0}
.ob .field{margin-top:0}

/* toast & confetti */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 16px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:80;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;min-height:48px;border-radius:16px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:var(--fs-s);width:max-content;max-width:calc(100% - 32px);transition:opacity .25s,transform .25s;box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{padding-right:8px}
#toast button{flex:none;min-height:36px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.14);color:var(--accent-2);font-weight:700}
:root[data-theme="light"] #toast button{background:rgba(255,255,255,.14)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabbar) + var(--safe-b));padding:6px 8px var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;background:var(--surface);background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
.tabbar button[data-tab]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:54px;color:var(--ink-3);font-size:var(--fs-s);font-weight:700;transition:color .2s}
.tabbar button[data-tab] svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tabbar button.on{color:var(--accent-text)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.1)}
.fab{justify-self:center;width:60px;height:60px;margin-top:-18px;border-radius:22px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.fab svg{width:28px;height:28px;stroke-width:2.5}
.fab:active{transform:scale(.92)}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes away{to{opacity:0;transform:translateX(24px)}}
@keyframes nowDone{0%{transform:scale(1)}30%{transform:scale(1.02)}100%{transform:scale(.96);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-20px) scale(1.05)}55%{transform:translateY(0) scale(.97)}75%{transform:translateY(-6px)}100%{transform:none}}
@keyframes flip{from{transform:translateY(-8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line)}}
</style>
</head>
<body>
<div id="app">
  <main id="view" class="view"></main>
  <button id="pill" class="pill-float" data-act="goFocus" hidden></button>
  <nav class="tabbar" aria-label="Main"></nav>
</div>
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="backdrop" data-act="closeAll"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></section>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
'use strict';
const VERSION = '1.0.0';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.tasks) || !d.profile) throw new Error('bad');
      S = migrate(d); saveNow(); applyTheme(); closeAll(); render(); toast('Backup restored ✨');
    } catch (e) { toast("That file doesn't look like a Nudge backup"); }
  };
  r.readAsText(file);
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $$('meta[name="theme-color"]').forEach(m => { m.content = dark ? '#111017' : '#F5F3EE'; });
}
function checkNewDay() {
  const k = dayKey(); if (S.lastDay === k) return false;
  const prev = S.lastDay; S.lastDay = k;
  const carried = S.tasks.filter(t => t.list === 'today' && !t.done).length;
  S.fresh = carried && S.wrapDay !== prev ? { day: k } : null;
  S.nowId = null; S.tasks.forEach(t => { t.skip = 0; });
  const cut = Date.now() - 45 * 864e5; S.tasks = S.tasks.filter(t => !(t.done && t.doneAt < cut));
  const wcut = Date.now() - 180 * 864e5; S.wins = S.wins.filter(w => w.ts > wcut); S.focusLog = S.focusLog.filter(f => f.ts > wcut);
  BODY_DONE = new Set();
  save(); return true;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { haptic(); go(tb.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); ac(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'dump') { updateDump(); return; }
  if (d.tf && SHEET?.name === 'task') {
    const t = task(SHEET.arg); if (!t) return;
    if (d.tf === 'when' || d.tf === 'then') t.plan[d.tf] = el.value;
    else if (d.tf === 'title') { t.title = el.value.replace(/\n/g, ' '); grow(el); }
    else t[d.tf] = el.value;
    save(); return;
  }
  if (d.sf && SHEET?.name === 'task') { const s = task(SHEET.arg)?.steps.find(x => x.id === d.sf); if (s) { s.text = el.value; save(); } return; }
  if (d.rf || d.rs) {
    const r = curRoutine(); if (!r) return;
    if (d.rf) r[d.rf] = el.value;
    else { const s = r.steps.find(x => x.id === d.rs); if (s) s[d.k] = d.k === 'mins' ? clamp(parseInt(el.value, 10) || 0, 0, 240) : el.value; }
    save(); return;
  }
  if (d.pf) { if (el.type !== 'time' || el.value) { S.profile[d.pf] = el.value; save(); render(); } return; }
  if (d.input === 'volume') { S.settings.volume = +el.value; setNoiseVol(); save(); }
});
document.addEventListener('focusout', e => {
  const r = curRoutine(), el = e.target;
  if (r && el.dataset.rf === 'name' && !el.value.trim()) { r.name = 'My routine'; save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (OVERLAY && OVERLAY.name !== 'onboard') closeOverlay(); else if (SHEET) closeAll(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  const k = e.target.dataset?.enter;
  if (k && ENTER[k]) { e.preventDefault(); ENTER[k](e.target); }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.file === 'import' && el.files[0]) { importData(el.files[0]); el.value = ''; } });
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, inp = f.querySelector('input'), v = (inp?.value || '').trim(); if (!v) return;
  if (f.dataset.form === 'win') { addWin('manual', v); save(); sfx.done(); haptic(); burstAt(inp); closeAll(); toast('Win logged! 🏆'); }
  if (f.dataset.form === 'menu') { S.menu[S.ui.menuTab].push(v); save(); render(); haptic(); }
});
// drag the sheet down by its handle to dismiss
(() => {
  const sheet = $('#sheet'); let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    if (e.touches[0].clientY - sheet.getBoundingClientRect().top > 36) return;
    y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sheet.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 90) closeAll(); });
})();
// keep sheets above the on-screen keyboard
if (window.visualViewport) {
  const vv = visualViewport, root = document.documentElement;
  const upd = () => { root.style.setProperty('--kb', Math.max(0, innerHeight - vv.height - vv.offsetTop) + 'px'); root.style.setProperty('--vvh', vv.height + 'px'); };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { saveNow(); return; }
  if (checkNewDay()) render();
  if (S.focus?.endAt) wakeOn();
  tick();
});
addEventListener('pagehide', saveNow);

/* ---------- clock ---------- */
let lastLive = 0;
function tick() {
  const now = Date.now(), f = S.focus;
  if (f) {
    const rem = focusLeft();
    const dl = $('#dial'); if (dl) dl.style.setProperty('--p', rem / f.total);
    const dt = $('#dialTime'); if (dt) dt.textContent = mmss(rem);
    const pt = $('#pillTime'); if (pt) pt.textContent = mmss(rem);
    if (f.endAt) {
      if (f.kind === 'focus') {
        const frac = 1 - rem / f.total;
        if (S.settings.chime && rem > 30000 && now - f.lastChime >= S.settings.chime * 60000) { f.lastChime = now; sfx.chime(); say(`⏰ Time check: ${dur((f.total - rem) / 60000)} in. Still on the next step?`); }
        else if (frac >= 0.5 && !f.ms.half) { f.ms.half = 1; say('Halfway there 🔥'); }
        else if (frac >= 0.8 && !f.ms.end) { f.ms.end = 1; say('Almost done — finish strong ✨'); }
        else if (now - f.lastMsg > 240000) say(pick(BUDDY_MID));
      }
      if (rem <= 0) finishFocus();
    }
  }
  if (OVERLAY?.name === 'run' && RUN) {
    const r = S.routines.find(x => x.id === RUN.id), s = r?.steps[RUN.idx];
    if (s && +s.mins) {
      const left = s.mins * 60000 - (now - RUN.stepStart), md = $('#runDial');
      if (md) md.style.setProperty('--p', clamp(left / (s.mins * 60000), 0, 1));
      const rt = $('#runTime'); if (rt) rt.textContent = left > 0 ? mmss(left) : '0:00';
      if (left <= 0 && !RUN.chimed) { RUN.chimed = true; sfx.chime(); const h = $('#runHint'); if (h) h.textContent = 'Time is up — no rush, finish when you can 🙂'; }
    }
  }
  const c = S.countdown;
  if (c) {
    if (!c.alerted && now >= c.at - c.prep * 60000) { c.alerted = true; save(); sfx.chime(); setTimeout(sfx.chime, 900); haptic(); toast(c.prep ? `🚪 Time to get ready for ${c.label}!` : `⏰ ${c.label} is starting!`); lastLive = 0; }
    if (now > c.at + 30 * 60000) { S.countdown = null; save(); lastLive = 0; }
  }
  if (now - lastLive > 20000) {
    lastLive = now;
    if (checkNewDay()) render();
    else if (TAB === 'today') {
      const tc = $('#timecard'); if (tc) tc.outerHTML = timeCard();
      const cc = $('#cdcard'); if (cc) cc.outerHTML = cdCard();
      else if (S.countdown && !$('#cdcard') && !SHEET) render();
    }
  }
}

/* ---------- boot ---------- */
$('.tabbar').innerHTML = `
  <button data-tab="today">${I.sun}<span>Today</span></button>
  <button data-tab="focus">${I.timer}<span>Focus</span></button>
  <button class="fab" data-act="capture" aria-label="Brain dump">${I.plus}</button>
  <button data-tab="routines">${I.repeat}<span>Routines</span></button>
  <button data-tab="me">${I.user}<span>Me</span></button>`;
applyTheme();
checkNewDay(); markActive(); save();
go('today');
if (!S.profile.onboarded) openOverlay('onboard');
else if (S.focus?.endAt) { startNoise(); wakeOn(); }
setInterval(tick, 250);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
